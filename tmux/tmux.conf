# Prefix: Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Number windows from 1 so Alt+1 is the first tab
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Don't wait for escape sequences (keeps Alt bindings snappy)
set -sg escape-time 0

# Prefix-free window ("tab") management with Alt
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-w kill-window

# Mouse scrolling (enters copy mode); typing while scrolled up drops back to the prompt
set -g mouse on
run-shell "~/.config/tmux/copy-mode-typing.sh"
